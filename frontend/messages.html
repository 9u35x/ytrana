<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>الدردشة — Ytrana</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
    }

    .messages-layout {
      min-height: calc(100vh - 120px);
      padding-bottom: 20px;
    }

    .conv-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--y-border);
      cursor: pointer;
    }

    .conv-item-info {
      flex: 1;
      min-width: 0;
    }

    .conv-item-name {
      font-weight: 600;
      font-size: 14px;
    }

    .conv-item-last {
      font-size: 13px;
      color: var(--y-text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conv-unread-badge {
      background: var(--y-primary);
      color: white;
      border-radius: 999px;
      min-width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      padding: 0 6px;
    }

    /* شاشة المحادثة */
    #chat-panel {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: var(--y-bg);
      z-index: 99999;

      display: none;
      flex-direction: column;
    }

    #chat-panel.show {
      display: flex !important;
    }

    /* رأس المحادثة */
    .chat-header {
      width: 100%;
      height: 60px;
      min-height: 60px;

      display: flex;
      align-items: center;
      gap: 10px;

      padding: 8px 12px;

      border-bottom: 1px solid var(--y-border);

      background: var(--y-bg);
    }

    #chat-with-name {
      font-weight: 600;
      flex: 1;
    }

    .icon-btn-plain {
      width: 40px;
      height: 40px;

      border: 0;
      background: transparent;

      font-size: 24px;
      cursor: pointer;

      color: var(--y-text);
    }

    /* منطقة الرسائل */
    #chat-messages {
      flex: 1;
      width: 100%;

      overflow-y: auto;

      padding: 16px;

      display: flex;
      flex-direction: column;
      gap: 8px;

      min-height: 0;
    }

    .chat-bubble-row {
      width: 100%;
      display: flex;
    }

    .chat-bubble-row.mine {
      justify-content: flex-end;
    }

    .chat-bubble {
      max-width: 75%;

      padding: 10px 14px;

      border-radius: 16px;

      background: var(--y-card-alt, #eeeeee);

      font-size: 14px;
      line-height: 1.5;

      word-break: break-word;
    }

    .chat-bubble-row.mine .chat-bubble {
      background: var(--y-primary);
      color: white;
    }

    /* =========================
       خانة كتابة الرسالة
    ========================= */

    .chat-form {
      position: relative;

      width: 100%;

      min-height: 64px;

      display: flex !important;
      align-items: center;

      gap: 8px;

      padding: 10px 12px;

      border-top: 1px solid var(--y-border);

      background: var(--y-bg);

      flex-shrink: 0;

      z-index: 100000;
    }

    #chat-input {
      display: block !important;

      flex: 1;

      width: 100%;

      height: 44px;

      min-height: 44px;

      padding: 0 15px;

      border-radius: 22px;

      border: 1px solid var(--y-border);

      background: var(--y-card-alt, #f5f5f5);

      color: var(--y-text);

      outline: none;

      font-size: 14px;
    }

    #chat-input:focus {
      border-color: var(--y-primary);
    }

    .chat-form button {
      display: flex !important;

      align-items: center;
      justify-content: center;

      height: 44px;

      min-width: 70px;

      border-radius: 22px;

      flex-shrink: 0;

      cursor: pointer;
    }

    /* البحث */
    #messages-search-header {
      width: 100%;
    }

    #user-search-results {
      margin-bottom: 8px;
      border-radius: 12px;
      overflow: hidden;
    }

    @media (max-width: 600px) {

      .chat-bubble {
        max-width: 85%;
      }

      .chat-form {
        padding: 8px;
      }

      #chat-input {
        font-size: 14px;
      }

      .chat-form button {
        min-width: 62px;
        padding: 0 10px;
      }
    }
  </style>
</head>

<body class="dir-rtl">

  <header
    class="y-header"
    id="y-header">
  </header>


  <main
    class="container messages-layout">

    <div id="conversations-list"></div>

  </main>


  <!-- =========================
       نافذة المحادثة
  ========================== -->

  <div id="chat-panel">

    <!-- الرأس -->

    <div class="chat-header">

      <button
        id="back-to-list"
        class="icon-btn-plain"
        type="button">
        →
      </button>

      <div id="chat-with-avatar"></div>

      <div id="chat-with-name">
        المحادثة
      </div>

    </div>


    <!-- الرسائل -->

    <div id="chat-messages"></div>


    <!-- =========================
         خانة الكتابة
    ========================== -->

    <form
      id="chat-form"
      class="chat-form">

      <input
        id="chat-input"
        type="text"
        placeholder="اكتب رسالة..."
        maxlength="2000"
        autocomplete="off">

      <button
        type="submit"
        class="btn btn-primary">

        إرسال

      </button>

    </form>

  </div>


  <nav
    class="y-bottom-nav"
    id="y-bottom-nav">
  </nav>


  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/messages.js"></script>

</body>
</html>
