<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>الدردشة — Ytrana</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    .messages-layout {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 120px);
      overflow-y: auto;
    }

    .conv-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--y-border);
      cursor: pointer;
    }

    .conv-item:hover {
      background: var(--y-card-alt, #f5f5f5);
    }

    .conv-item-info {
      flex: 1;
      min-width: 0;
    }

    .conv-item-name {
      font-weight: 600;
      font-size: 14px;
    }

    .conv-item-last {
      font-size: 13px;
      color: var(--y-text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conv-unread-badge {
      background: var(--y-primary);
      color: #fff;
      border-radius: 999px;
      font-size: 11px;
      min-width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
    }

    #user-search-results {
      margin-bottom: 8px;
      background: var(--y-bg);
      border-radius: 12px;
    }

    .search-user-item:hover {
      background: var(--y-card-alt, #f5f5f5);
    }

    #chat-panel {
      position: fixed;
      inset: 0;
      background: var(--y-bg);
      z-index: 50;
      display: none;
      flex-direction: column;
    }

    #chat-panel.show {
      display: flex;
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--y-border);
    }

    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-bubble-row {
      display: flex;
    }

    .chat-bubble-row.mine {
      justify-content: flex-end;
    }

    .chat-bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 16px;
      background: var(--y-card-alt, #f0f0f5);
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .chat-bubble-row.mine .chat-bubble {
      background: var(--y-primary);
      color: #fff;
    }

    .chat-form {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      border-top: 1px solid var(--y-border);
    }

    .chat-form input {
      flex: 1;
    }

    .icon-btn-plain {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>

<body class="dir-rtl">

  <header class="y-header" id="y-header"></header>

  <main class="container messages-layout">

    <div id="conversations-list"></div>

  </main>

  <!-- نافذة المحادثة -->

  <div id="chat-panel">

    <div class="chat-header">

      <button
        class="icon-btn-plain"
        id="back-to-list"
        type="button"
      >
        →
      </button>

      <div id="chat-with-avatar"></div>

      <div
        id="chat-with-name"
        style="font-weight:600;"
      ></div>

    </div>

    <div id="chat-messages"></div>

    <form
      class="chat-form"
      id="chat-form"
    >

      <input
        type="text"
        id="chat-input"
        placeholder="اكتب رسالة..."
        maxlength="2000"
        autocomplete="off"
      >

      <button
        type="submit"
        class="btn btn-primary btn-sm"
      >
        إرسال
      </button>

    </form>

  </div>

  <nav
    class="y-bottom-nav"
    id="y-bottom-nav"
  ></nav>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/messages.js"></script>

</body>
</html>
