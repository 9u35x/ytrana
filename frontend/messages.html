<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>الدردشة — Ytrana</title>

  <link rel="stylesheet" href="css/style.css">

  <style>

    /* =====================================================
       الأساس
    ===================================================== */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      overflow-x: hidden;
    }


    /* =====================================================
       قائمة المحادثات
    ===================================================== */

    .messages-layout {
      min-height: calc(100vh - 120px);
      padding-bottom: 20px;
    }

    .conv-item {
      width: 100%;

      display: flex;
      align-items: center;

      gap: 12px;

      padding: 13px 16px;

      border-bottom: 1px solid var(--y-border);

      cursor: pointer;

      transition: background 0.15s ease;
    }

    .conv-item:hover {
      background: var(--y-card);
    }

    .conv-item-info {
      flex: 1;
      min-width: 0;
    }

    .conv-item-name {
      color: var(--y-text);

      font-size: 14px;
      font-weight: 600;
    }

    .conv-item-last {
      margin-top: 3px;

      color: var(--y-text-secondary);

      font-size: 13px;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .conv-unread-badge {
      min-width: 21px;
      height: 21px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0 6px;

      border-radius: 999px;

      background: var(--y-primary);

      color: #fff;

      font-size: 11px;
      font-weight: 600;
    }


    /* =====================================================
       البحث
    ===================================================== */

    #messages-search-header {
      width: 100%;
    }

    #user-search-results {
      width: 100%;

      margin-bottom: 8px;

      background: var(--y-bg);

      border: 1px solid var(--y-border);

      border-radius: 12px;

      overflow: hidden;
    }

    .search-user-item {
      width: 100%;

      display: flex;

      align-items: center;

      gap: 12px;

      padding: 12px;

      border-bottom: 1px solid var(--y-border);

      background: var(--y-bg);

      color: var(--y-text);

      cursor: pointer;
    }

    .search-user-item:last-child {
      border-bottom: 0;
    }

    .search-user-item:hover {
      background: var(--y-card);
    }


    /* =====================================================
       شاشة المحادثة
    ===================================================== */

    #chat-panel {

      position: fixed;

      top: 0;
      right: 0;
      bottom: 0;
      left: 0;

      width: 100%;
      height: 100%;

      display: none;

      flex-direction: column;

      background: var(--y-bg);

      color: var(--y-text);

      z-index: 99999;

      overflow: hidden;
    }

    #chat-panel.show {
      display: flex !important;
    }


    /* =====================================================
       رأس المحادثة
    ===================================================== */

    .chat-header {

      width: 100%;

      height: 62px;
      min-height: 62px;

      display: flex;

      align-items: center;

      gap: 10px;

      padding: 8px 12px;

      background: var(--y-bg);

      border-bottom: 1px solid var(--y-border);

      flex-shrink: 0;
    }

    #chat-with-avatar {
      display: flex;

      align-items: center;
      justify-content: center;

      flex-shrink: 0;
    }

    #chat-with-name {

      flex: 1;

      min-width: 0;

      color: var(--y-text);

      font-size: 15px;

      font-weight: 600;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .icon-btn-plain {

      width: 40px;
      height: 40px;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 0;

      border: 0;

      border-radius: 50%;

      background: transparent;

      color: var(--y-text);

      font-size: 24px;

      cursor: pointer;
    }

    .icon-btn-plain:hover {
      background: var(--y-card);
    }


    /* =====================================================
       منطقة الرسائل
    ===================================================== */

    #chat-messages {

      flex: 1;

      width: 100%;

      min-height: 0;

      overflow-y: auto;

      padding: 16px;

      display: flex;

      flex-direction: column;

      gap: 8px;

      background: var(--y-bg);
    }


    /* صف الرسالة */

    .chat-bubble-row {

      width: 100%;

      display: flex;

      align-items: flex-end;

      justify-content: flex-start;
    }

    .chat-bubble-row.mine {
      justify-content: flex-end;
    }


    /* =====================================================
       الرسائل الواردة
    ===================================================== */

    .chat-bubble {

      max-width: min(75%, 500px);

      padding: 10px 14px;

      border-radius: 17px;

      background: var(--y-card);

      color: var(--y-text);

      border: 1px solid var(--y-border);

      font-size: 14px;

      line-height: 1.55;

      word-break: break-word;

      overflow-wrap: anywhere;

      white-space: pre-wrap;

      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .chat-message-meta {
      display: flex;
      justify-content: flex-start;
      gap: 8px;
      margin-top: 4px;
      font-size: 10px;
      opacity: 0.72;
    }


    /* =====================================================
       رسائلي
    ===================================================== */

    .chat-bubble-row.mine .chat-bubble {

      background: var(--y-primary) !important;

      color: #fff !important;

      border-color: var(--y-primary) !important;

      border-radius: 17px 17px 4px 17px;
    }


    /* =====================================================
       الرسائل الواردة
    ===================================================== */

    .chat-bubble-row:not(.mine) .chat-bubble {

      background: var(--y-card) !important;

      color: var(--y-text) !important;

      border-color: var(--y-border) !important;

      border-radius: 17px 17px 17px 4px;
    }


    /* =====================================================
       خانة كتابة الرسالة
    ===================================================== */

    #chat-form {

      width: 100%;

      min-height: 70px;

      display: flex !important;

      align-items: center;

      gap: 8px;

      padding: 10px 12px;

      background: var(--y-bg) !important;

      border-top: 1px solid var(--y-border);

      flex-shrink: 0;

      position: relative;

      z-index: 100000;
    }


    /* =====================================================
       حقل الكتابة
    ===================================================== */

    #chat-input {

      display: block !important;

      visibility: visible !important;

      opacity: 1 !important;

      flex: 1;

      width: 100%;

      min-width: 0;

      height: 46px;

      padding: 0 16px;

      border: 1px solid var(--y-border) !important;

      border-radius: 23px;

      outline: none;

      background: var(--y-card) !important;

      color: var(--y-text) !important;

      font-family: inherit;

      font-size: 14px;

      transition:
        border-color 0.15s ease,
        background 0.15s ease;
    }

    #chat-input::placeholder {

      color: var(--y-text-secondary);

      opacity: 1;
    }

    #chat-input:focus {

      border-color: var(--y-primary) !important;

      background: var(--y-card) !important;
    }


    /* =====================================================
       زر الإرسال
    ===================================================== */

    #chat-form button {

      display: flex !important;

      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      height: 46px;

      min-width: 70px;

      padding: 0 15px;

      border: 0;

      border-radius: 23px;

      background: var(--y-primary);

      color: #fff;

      font-family: inherit;

      font-size: 14px;

      font-weight: 600;

      cursor: pointer;

      transition: opacity 0.15s ease;
    }

    #chat-form button:hover {
      opacity: 0.9;
    }

    #chat-form button:active {
      transform: scale(0.98);
    }


    /* =====================================================
       حالة عدم وجود رسائل
    ===================================================== */

    #chat-messages .empty-state {

      width: 100%;

      margin: auto;

      text-align: center;

      color: var(--y-text-secondary);
    }


    /* =====================================================
       شريط التمرير
    ===================================================== */

    #chat-messages::-webkit-scrollbar {
      width: 5px;
    }

    #chat-messages::-webkit-scrollbar-thumb {

      background: var(--y-border);

      border-radius: 10px;
    }


    /* =====================================================
       الهاتف
    ===================================================== */

    @media (max-width: 600px) {

      .chat-header {
        height: 58px;
        min-height: 58px;

        padding: 7px 10px;
      }

      #chat-messages {
        padding: 12px;
      }

      .chat-bubble {
        max-width: 85%;

        font-size: 14px;

        padding: 9px 13px;
      }

      #chat-form {

        min-height: 64px;

        padding: 8px;
      }

      #chat-input {

        height: 44px;

        font-size: 14px;
      }

      #chat-form button {

        height: 44px;

        min-width: 62px;

        padding: 0 12px;
      }
    }

  .mood-panel{padding:14px 16px;margin-bottom:14px;border-radius:20px;background:linear-gradient(135deg,var(--y-card,#fff),#faf9ff)}.mood-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.mood-heading{min-width:0}.mood-panel h2{font-size:1.05rem;margin:0 0 4px}.mood-summary{margin:0;color:var(--y-text-secondary);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mood-toggle{flex:0 0 auto;border:0;border-radius:12px;padding:9px 13px;background:#efecff;color:#5b45d2;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.mood-feed-section{margin-top:12px}.mood-feed-heading{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--y-text-secondary)}.mood-feed{display:flex;gap:8px;overflow-x:auto;padding:9px 1px 2px;scrollbar-width:thin}.mood-chip{display:block;flex:0 0 176px;max-width:176px;padding:10px 12px;border:1px solid var(--y-border);border-radius:15px;background:var(--y-bg,#f7f6fb);white-space:normal;font-size:12px}.mood-chip strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--y-text)}.mood-chip small{display:block;margin-top:3px;color:var(--y-text-secondary);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mood-panel form:not([hidden]){display:grid;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--y-border)}.mood-panel form[hidden]{display:none!important}.mood-panel .story-mood-row{margin:0}.mood-form-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.mood-form-actions small{color:var(--y-text-secondary)}.mood-panel .form-control{margin:0;border-radius:13px}@media(max-width:480px){.mood-panel{padding:12px}.mood-chip{flex-basis:156px;max-width:156px}.mood-toggle{padding:8px 10px}}</style>
  <link rel="stylesheet" href="css/report-dialog.css">
</head>


<body class="dir-rtl">


  <!-- =====================================================
       الهيدر الرئيسي
  ====================================================== -->

  <header
    class="y-header"
    id="y-header">
  </header>


  <!-- =====================================================
       قائمة المحادثات
  ====================================================== -->

  <main class="container messages-layout">
    <section class="card mood-panel" aria-labelledby="mood-panel-title"><div class="mood-top"><div class="mood-heading"><h2 id="mood-panel-title">ملاحظات الحالة</h2><p id="messages-mood-summary" class="mood-summary">تظهر ملاحظتك لمتابعيك لمدة 24 ساعة</p></div><button type="button" id="messages-mood-toggle" class="mood-toggle" aria-expanded="false">أضف حالتك</button></div><div class="mood-feed-section"><div class="mood-feed-heading"><strong>من تتابعهم</strong><span id="messages-mood-count">0</span></div><div id="messages-mood-feed" class="mood-feed"></div></div><form id="messages-mood-form" hidden><div class="story-mood-row" id="messages-mood-options" role="group" aria-label="اختر مزاجك"></div><label class="form-label" for="messages-mood-note">ملاحظتي لمتابعيني</label><input class="form-control" id="messages-mood-note" maxlength="120" placeholder="اكتب ملاحظة قصيرة"><div class="mood-form-actions"><small id="messages-mood-counter">0/120</small><button class="btn btn-primary btn-sm" type="submit">حفظ الحالة</button></div></form></section>
    <div id="conversations-list"></div>

  </main>


  <!-- =====================================================
       نافذة المحادثة
  ====================================================== -->

  <div id="chat-panel">


    <!-- رأس المحادثة -->

    <div class="chat-header">

      <button
        id="back-to-list"
        class="icon-btn-plain"
        type="button"
        aria-label="رجوع">

        ←

      </button>


      <div id="chat-with-avatar"></div>


      <div id="chat-with-name">
        المحادثة
      </div>

    </div>


    <!-- ===================================================
         الرسائل
    ==================================================== -->

    <div id="chat-messages">

      <div class="empty-state">

        <p>
          ابدأ المحادثة 👋
        </p>

      </div>

    </div>


    <!-- ===================================================
         كتابة الرسالة
    ==================================================== -->

    <form
      id="chat-form"
      autocomplete="off">


      <input
        id="chat-input"
        type="text"
        maxlength="2000"
        placeholder="اكتب رسالة..."
        autocomplete="off"
        spellcheck="true">


      <button
        type="submit"
        class="btn btn-primary">

        إرسال

      </button>


    </form>

  </div>


  <!-- =====================================================
       التنقل السفلي
  ====================================================== -->

  <nav
    class="y-bottom-nav"
    id="y-bottom-nav">
  </nav>


  <!-- =====================================================
       ملفات JavaScript
  ====================================================== -->

  <script src="js/config.js"></script>

  <script src="js/api.js"></script>

  <script src="js/auth.js"></script>

  <script src="js/theme.js"></script>

  <script src="js/toast.js"></script>

  <script src="js/avatar.js"></script>

  <script src="js/post-card.js"></script>
  <script src="js/layout.js"></script>

  <script src="js/messages.js"></script>


</body>

</html>
