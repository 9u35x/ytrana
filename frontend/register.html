<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>إنشاء حساب — Ytrana</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="dir-rtl" style="padding-bottom:0;">
  <div class="auth-wrapper">
    <div class="auth-box card">
      <div class="auth-logo">Ytrana</div>
      <p class="auth-subtitle">أنشئ حسابك وابدأ التواصل مع من تريد</p>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="reg-fullname">الاسم الكامل</label>
          <input type="text" id="reg-fullname" class="form-control" autocomplete="name" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-username">اسم المستخدم (Username)</label>
          <input type="text" id="reg-username" class="form-control" autocomplete="username" placeholder="مثال: ahmed_dev" required>
          <p class="form-hint">حروف إنجليزية وأرقام و . _ فقط، بين 3 و30 حرفًا</p>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-email">البريد الإلكتروني</label>
          <input type="email" id="reg-email" class="form-control" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-password">كلمة المرور</label>
          <input type="password" id="reg-password" class="form-control" autocomplete="new-password" required>
          <p class="form-hint">8 أحرف على الأقل، وتحتوي على حروف وأرقام</p>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-password2">تأكيد كلمة المرور</label>
          <input type="password" id="reg-password2" class="form-control" autocomplete="new-password" required>
        </div>

        <div id="register-error" class="form-error"></div>

        <button type="submit" id="register-submit" class="btn btn-primary btn-block mt-4">إنشاء حساب</button>
      </form>

      <p class="auth-footer">لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a></p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
