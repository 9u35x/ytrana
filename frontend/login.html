<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>تسجيل الدخول — Ytrana</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="dir-rtl" style="padding-bottom:0;">
  <div class="auth-wrapper">
    <div class="auth-box card">
      <div class="auth-logo">Ytrana</div>
      <p class="auth-subtitle">أهلًا بعودتك، سجّل الدخول لمتابعة آخر المستجدات</p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="login-identifier">اسم المستخدم أو البريد الإلكتروني</label>
          <input type="text" id="login-identifier" class="form-control" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">كلمة المرور</label>
          <input type="password" id="login-password" class="form-control" autocomplete="current-password" required>
        </div>

        <div id="login-error" class="form-error"></div>

        <button type="submit" id="login-submit" class="btn btn-primary btn-block mt-4">تسجيل الدخول</button>
      </form>

      <p class="auth-footer">ليس لديك حساب؟ <a href="register.html">إنشاء حساب جديد</a></p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
