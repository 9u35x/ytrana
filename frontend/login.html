<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6C5CE7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ytrana">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>تسجيل الدخول — Ytrana</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/security.css">
</head>
<body class="dir-rtl" style="padding-bottom:0;">
  <div class="auth-wrapper">
    <div class="auth-box card">
      <div class="auth-logo">Ytrana</div>
      <p class="auth-subtitle">أهلًا بعودتك، سجّل الدخول لمتابعة آخر المستجدات</p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="login-identifier">اسم المستخدم أو البريد الإلكتروني</label>
          <input type="text" id="login-identifier" class="form-control" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">كلمة المرور</label>
          <input type="password" id="login-password" class="form-control" autocomplete="current-password" required>
        </div>

        <div id="login-error" class="form-error"></div>

        <button type="submit" id="login-submit" class="btn btn-primary btn-block mt-4">تسجيل الدخول</button>
      </form>

      <form id="login-otp-form" hidden novalidate>
        <p class="form-hint" id="login-otp-hint" aria-live="polite">اختر طريقة التحقق لإكمال تسجيل الدخول.</p>
        <div class="form-group">
          <label class="form-label" for="login-otp-method">طريقة التحقق</label>
          <select id="login-otp-method" class="form-control" required></select>
        </div>
        <div class="form-group" id="login-otp-code-group" hidden>
          <label class="form-label" for="login-otp-code">رمز التحقق (6 أرقام)</label>
          <input type="text" id="login-otp-code" class="form-control" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6">
        </div>
        <div id="login-otp-error" class="form-error" aria-live="polite"></div>
        <button type="submit" id="login-otp-submit" class="btn btn-primary btn-block mt-4">متابعة</button>
        <button type="button" id="login-otp-back" class="btn btn-outline btn-block mt-2">العودة لتسجيل الدخول</button>
      </form>

      <p class="auth-footer">ليس لديك حساب؟ <a href="register.html">إنشاء حساب جديد</a></p>
      <p class="form-hint">للاستخدام المؤقت على iPhone: افتح الموقع في Safari، ثم اضغط «مشاركة» واختر «إضافة إلى الشاشة الرئيسية».</p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
