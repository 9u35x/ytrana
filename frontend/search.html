<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>البحث — Ytrana</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="dir-rtl">
  <header class="y-header" id="y-header"></header>

  <main class="container">
    <div class="form-group mt-4">
      <label class="form-label" for="search-input">اكتشف أشخاصًا في Ytrana</label>
      <input type="search" id="search-input" class="form-control" placeholder="اسم الشخص أو @اسم_المستخدم" autocomplete="off" inputmode="search" maxlength="60" aria-describedby="search-hint">
      <p class="form-hint" id="search-hint">تظهر المطابقات الأقرب أولاً.</p>
    </div>
    <div id="search-results" aria-live="polite"><div class="empty-state"><div class="icon">🔍</div><p>اكتب اسمًا أو اسم مستخدم للبحث</p></div></div>
  </main>

  <nav class="y-bottom-nav" id="y-bottom-nav"></nav>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
