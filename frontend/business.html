<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#6C5CE7"><title>الأعمال المحلية · Ytrana</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/community.css">  <link rel="stylesheet" href="css/report-dialog.css">
</head>
<body class="dir-rtl">
  <header class="y-header" id="y-header"></header>
  <main class="container feature-page">
    <a class="feature-back" href="community.html">‹ العودة إلى المجتمع</a>
    <section id="business-list-view">
      <div class="feature-hero card"><span class="feature-icon">▣</span><div><h1>الأعمال المحلية</h1><p>اكتشف الأنشطة والخدمات، أو أنشئ صفحة لنشاطك.</p></div></div>
      <section class="card feature-panel"><h2>صفحة نشاطي</h2><div id="my-business-page"><div class="loading-spinner"></div></div></section>
      <form id="business-create-form" class="card feature-panel feature-form hidden">
        <h2>إنشاء صفحة أعمال</h2><label class="form-label">اسم النشاط<input class="form-control" name="name" minlength="2" maxlength="120" required></label>
        <label class="form-label">نبذة<textarea class="form-control" name="description" maxlength="2000"></textarea></label>
        <div class="form-row"><label class="form-label">البريد للتواصل<input class="form-control" name="contact_email" type="email" maxlength="255"></label><label class="form-label">الهاتف<input class="form-control" name="contact_phone" type="tel" maxlength="30"></label></div>
        <label class="form-label">الموقع الإلكتروني<input class="form-control" name="website_url" type="url" maxlength="255"></label>
        <div class="form-row"><label class="form-label">صورة النشاط<input class="form-control" name="image" type="file" accept="image/*"></label><label class="form-label">غلاف<input class="form-control" name="cover" type="file" accept="image/*"></label></div>
        <button class="btn btn-primary" type="submit">إنشاء الصفحة</button>
      </form>
      <div class="feature-search"><input id="business-search" class="form-control" type="search" placeholder="ابحث عن نشاط أو خدمة…"><button id="business-search-btn" class="btn btn-outline" type="button">بحث</button></div>
      <div id="business-list" class="feature-list"><div class="loading-spinner"></div></div>
    </section>
    <section id="business-detail-view" class="hidden"><div id="business-detail"></div>
      <section id="business-edit-section" class="card feature-panel hidden"><h2>إدارة الصفحة</h2><form id="business-edit-form" class="feature-form"><label class="form-label">اسم النشاط<input class="form-control" name="name" maxlength="120"></label><label class="form-label">نبذة<textarea class="form-control" name="description" maxlength="2000"></textarea></label><div class="form-row"><label class="form-label">البريد<input class="form-control" name="contact_email" type="email"></label><label class="form-label">الهاتف<input class="form-control" name="contact_phone" type="tel"></label></div><label class="form-label">الموقع الإلكتروني<input class="form-control" name="website_url" type="url"></label><div class="feature-form-actions"><button class="btn btn-primary" type="submit">حفظ التعديلات</button><button class="btn btn-outline" id="business-archive" type="button">إيقاف الصفحة</button></div></form></section>
      <section id="business-products-section" class="card feature-panel"><h2>المنتجات والخدمات</h2><form id="business-product-form" class="feature-form hidden"><label class="form-label">اسم المنتج أو الخدمة<input class="form-control" name="name" minlength="2" maxlength="120" required></label><label class="form-label">الوصف<textarea class="form-control" name="description" maxlength="2000"></textarea></label><div class="form-row"><label class="form-label">السعر (اختياري)<input class="form-control" name="price" maxlength="32" placeholder="مثال: 25,000 د.ع"></label><label class="form-label">رابط صورة اختياري<input class="form-control" name="image_url" type="url" maxlength="255"></label></div><button class="btn btn-primary" type="submit">إضافة بطاقة</button></form><div id="business-products" class="feature-list"></div></section>
      <form id="business-post-form" class="card feature-panel feature-form hidden"><h2>منشور باسم النشاط</h2><textarea class="form-control" name="content" maxlength="3000" placeholder="أخبار أو عروض أو تحديثات النشاط"></textarea><label class="form-label">صورة أو فيديو <input class="form-control" name="media" type="file" accept="image/*,video/*"></label><button class="btn btn-primary" type="submit">نشر</button></form>
      <section class="card feature-panel"><h2>منشورات النشاط</h2><div id="business-posts"></div></section>
    </section>
  </main>
  <nav class="y-bottom-nav" id="y-bottom-nav"></nav>
  <script src="js/config.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/theme.js"></script><script src="js/toast.js"></script><script src="js/avatar.js"></script><script src="js/layout.js"></script><script src="js/post-card.js"></script><script src="js/business.js"></script>
</body></html>
