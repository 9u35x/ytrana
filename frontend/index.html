<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6C5CE7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ytrana">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>Ytrana</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/verification.css?v=a62f6e3b6910">
  <link rel="stylesheet" href="css/stories-home.css">

  <link rel="stylesheet" href="css/report-dialog.css">
</head>
<body class="dir-rtl">
  <header class="y-header" id="y-header"></header>

  <main class="container">
    <section id="stories-bar" aria-label="القصص"></section>
    <div id="home-story-modal" class="home-story-modal"><div class="home-story-box"><div class="story-modal-head"><strong>أضف قصتك</strong><button type="button" id="home-story-modal-close" class="icon-btn-plain">✕</button></div><form id="home-story-form"><textarea class="form-control" name="caption" maxlength="500" placeholder="اكتب شيئًا عن لحظتك…"></textarea><label class="form-label" for="home-story-file">صورة أو فيديو (اختياري)</label><input class="form-control" id="home-story-file" name="file" type="file" accept="image/*,video/*"><div id="home-story-file-label" class="form-hint">تظهر القصة 24 ساعة</div><div class="story-mood-row"><label><input type="radio" name="mood_key" value="happy"> 😊 سعيد</label><label><input type="radio" name="mood_key" value="sad"> 😔 حزين</label></div><button class="btn btn-primary btn-block" type="submit">نشر القصة</button></form></div></div>
    <div id="home-story-viewer" class="home-story-viewer"><div class="home-story-box"><div class="story-modal-head"><strong>القصة</strong><button type="button" id="home-story-close" class="icon-btn-plain">✕</button></div><div id="home-story-content" class="home-story-content"></div><p id="home-story-caption" class="home-story-caption"></p><form id="home-story-reply-form" class="story-reply"><input id="home-story-reply" maxlength="500" placeholder="اكتب ردًا على القصة…" aria-label="اكتب ردًا على القصة"><button type="submit" aria-label="إرسال الرد">إرسال</button></form></div></div>

    <div class="card composer">
      <div class="composer-top">
        <div id="composer-avatar"></div>
        <textarea id="composer-text" placeholder="بم تفكر؟" maxlength="3000"></textarea>
      </div>

      <div class="composer-preview" id="composer-preview">
        <img id="composer-preview-img" src="" alt="معاينة الوسائط"><video id="composer-preview-video" controls></video>
        <button type="button" class="remove-img" id="composer-remove-img">✕</button>
      </div>

      <div class="composer-actions">
        <label class="btn btn-outline btn-sm" style="cursor:pointer;">
          📷 صورة أو فيديو
          <input type="file" id="composer-image-input" accept="image/*,video/*" hidden>
        </label>
        <div class="story-mood-row"><label><input type="radio" name="composer-mood" value="happy"> 😊 سعيد</label><label><input type="radio" name="composer-mood" value="sad"> 😔 حزين</label></div>

        <button type="button" id="composer-submit" class="btn btn-primary btn-sm">
          نشر
        </button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="feed-tab-explore">استكشف</button>
      <button class="tab-btn" id="feed-tab-following">أتابعهم</button>
    </div>

    <div id="feed-list"></div>
  </main>


  <nav class="y-bottom-nav" id="y-bottom-nav"></nav>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js?v=93fdc407a9e2"></script>
  <script src="js/theme.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/post-card.js?v=742c87c0b947"></script>
  <script src="js/feed.js"></script>
  <script src="js/stories-home.js"></script>
</body>
</html>
